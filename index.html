function renderTab(t){if(t.done)return;t.done=1;var p=document.getElementById('p-'+t.slug);
  var x='<p class="tabdesc"><b>'+esc(t.name)+'</b> — '+esc(t.desc)+'</p><nav class="jump" aria-label="묶음 바로 가기">'+t.groups.map(function(g){return'<a'+(g.kind==='web'?' class="w"':'')+' href="#g-'+g.key+'">'+(g.kind==='web'?'웹사이트 첫 화면':esc(g.name))+' <span class="n">'+g.cards.length+'</span></a>'}).join('')+'</nav>';
  t.groups.forEach(function(g,i){if(g.kind==='mood'&&!i)x+='<p class="part">무드 컨셉 — 모두 웹사이트가 한눈에 보이는 그림이에요. 그림을 누르면 원본이 열려요.</p>';
    x+='<section class="group '+g.kind+'" id="g-'+g.key+'"><header><span class="gk">'+g.label+'</span><div><h2>'+esc(g.name)+' <span class="n">'+g.cards.length+'</span></h2><p>'+esc(g.desc)+'</p></div></header><div class="grid'+(g.kind==='web'?' gw':'')+'">'+g.cards.map(cardHtml).join('')+'</div></section>'});
  p.innerHTML=x;p.querySelectorAll('.card').forEach(paint)}
function paint(el){var s=get(el.dataset.id);
  el.querySelectorAll('.chip').forEach(function(b){b.setAttribute('aria-pressed',s.tags.indexOf(b.dataset.tag)>=0)});
  el.querySelector('.nope').setAttribute('aria-pressed',!!s.nope);el.classList.toggle('has',s.tags.length>0);el.classList.toggle('is-nope',!!s.nope);
  var m=el.querySelector('.memo');if(document.activeElement!==m)m.value=s.memo||''}
function used(fn){return cards.filter(function(c){return fn(get(c.id))})}
function counts(){var p=0,n=0,hero=0,per={};cards.forEach(function(c){var s=get(c.id);if(s.tags.length||s.nope)per[c.tab]=(per[c.tab]||0)+1;if(s.tags.length)p++;if(s.nope)n++;if(s.tags.indexOf('mood')>=0)hero++});
  document.getElementById('cnt').innerHTML='고른 카드 <b>'+p+'</b> · 싫다 <b>'+n+'</b>';
  F.tabs.forEach(function(t){var all=t.groups.reduce(function(a,g){return a+g.cards.length},0);document.getElementById('n-'+t.slug).textContent=all+(per[t.slug]?' · 고름 '+per[t.slug]:'')});
  var ok=hero&&n;document.getElementById('need').innerHTML='<span class="st'+(hero?' ok':'')+'">전체 무드 '+hero+'</span><span class="st'+(n?' ok':'')+'">이건 싫다 '+n+'</span><span class="msg">'+(ok?'좋아요. 다 고르면 아래 「골라 둔 것 복사」':'「전체 무드」 · 「이건 싫다」 칸에 하나 이상 골라 주세요')+'</span>'}
function fig(c){var s=get(c.id);return'<figure'+(c.kind==='web'?' class="w"':'')+'><img loading="lazy" src="'+esc(c.img)+'" alt=""><figcaption><b>'+esc(c.code)+'</b>'+(c.kind==='web'?' '+esc(c.name.split(' (')[0]):'')+(s.memo?' · '+esc(s.memo):'')+'</figcaption></figure>'}
function summary(){var x='<p class="tabdesc">다섯 탭에서 고른 것을 칸별로 모았어요. 다 고르면 아래 「골라 둔 것 복사」를 눌러 Claude에게 붙여 넣어 주세요.</p>';
  TAGS.forEach(function(t){var l=used(function(s){return s.tags.indexOf(t[0])>=0});x+='<h2>'+t[1]+' <span class="n">'+l.length+'</span></h2>'+(l.length?'<div class="thumbs">'+l.map(fig).join('')+'</div>':'<p class="none">아직 없음</p>')});
  var no=used(function(s){return s.nope});x+='<h2>✕ 이건 싫다 <span class="n">'+no.length+'</span></h2>'+(no.length?'<div class="thumbs">'+no.map(fig).join('')+'</div>':'<p class="none">아직 없음</p>');
  document.getElementById('sum').innerHTML=x}

function text(){var L=['[첫 판에서 고른 것] '+F.title+' · '+F.made];
  function lst(l){return l.map(function(c){var m=get(c.id).memo;return c.code+(m?'('+m+')':'')}).join(', ')||'없음'}
  TAGS.forEach(function(t){L.push(t[1]+': '+lst(used(function(s){return s.tags.indexOf(t[0])>=0})))});
  L.push('이건 싫다: '+lst(used(function(s){return s.nope})));
  var u=used(function(s){return s.tags.length||s.nope});
  if(u.length){L.push('','카드 자세히:');u.forEach(function(c){var s=get(c.id),tn=tabOf[c.tab].name;
    var head=(s.nope?'✕ ':'♥ ')+c.code+' · '+(c.kind==='web'?'웹사이트':'무드 핀')+' · '+(s.nope?'이건 싫다':s.tags.map(function(t){return LAB[t]}).join(', '))+(s.memo?' — '+s.memo:'');
    var tail=c.kind==='web'?[tn,'이름 「'+c.name+'」',c.kr,'첫 화면 「'+c.line+'」','주소 '+c.link,'그림 '+absUrl(c.img)]:[tn+' · '+c.gname,'「'+c.line+'」',c.title?'제목 「'+c.title+'」':'','검색어 「'+c.q+'」',(/^\d+$/.test(c.pin)?'핀 ':'주소 ')+c.link,'그림 '+c.img];
    L.push(head+' · '+tail.filter(Boolean).join(' · '))})}
  return L.join('\n')}
function sync(id){var el=app.querySelector('.card[data-id="'+(window.CSS&&CSS.escape?CSS.escape(id):id)+'"]');if(el)paint(el);counts();if(cur==='sum')summary()}
app.addEventListener('click',function(e){var b=e.target.closest('.chip,.nope');if(!b)return;var el=b.closest('.card'),id=el.dataset.id,s=st(id);
  if(b.classList.contains('chip')){var t=b.dataset.tag,i=s.tags.indexOf(t);if(i>=0)s.tags.splice(i,1);else s.tags.push(t);if(s.tags.length)s.nope=false}else{s.nope=!s.nope;if(s.nope)s.tags=[]}
  save();sync(id)});
app.addEventListener('input',function(e){if(!e.target.classList.contains('memo'))return;var id=e.target.closest('.card').dataset.id;st(id).memo=e.target.value;save()});
app.addEventListener('error',function(e){var im=e.target;if(im&&im.tagName==='IMG'){var c=im.closest('.card');if(c)c.classList.add('broken')}},true);
var tabs=[].slice.call(app.querySelectorAll('.tabs button')),cur='';
function show(p,keep){if(p!=='sum'&&!tabOf[p])p=F.tabs[0].slug;cur=p;if(tabOf[p])renderTab(tabOf[p]);else summary();
  tabs.forEach(function(t){t.setAttribute('aria-selected',t.dataset.p===p)});app.querySelectorAll('.panel').forEach(function(x){x.classList.toggle('on',x.id==='p-'+p)});
  try{localStorage.setItem(KEY+':tab',p)}catch(e){}if(!keep)try{history.replaceState(null,'','#'+p)}catch(e){}}
tabs.forEach(function(t){t.addEventListener('click',function(){show(t.dataset.p);window.scrollTo({top:0})})});
var hs=(location.hash||'').slice(1),h0=hs.replace(/^g-/,'').split('-')[0],t0=F.tabs[0].slug;try{t0=localStorage.getItem(KEY+':tab')||t0}catch(e){}
if(tabOf[h0]||h0==='sum'){show(h0,true);var g=document.getElementById(hs);if(g)g.scrollIntoView()}else show(t0);
var box=document.getElementById('copybox'),ta=document.getElementById('copytext');
document.getElementById('copyclose').addEventListener('click',function(){box.classList.remove('on')});
document.getElementById('copy').addEventListener('click',function(e){var b=e.currentTarget,t=text();window.__lastCopy=t;
  function done(){b.textContent='복사됨';setTimeout(function(){b.textContent='골라 둔 것 복사'},1500)}
  function fall(){ta.value=t;box.classList.add('on');ta.focus();ta.select();try{if(document.execCommand('copy'))done()}catch(x){}}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,fall);else fall()});
var armed=0;document.getElementById('clear').addEventListener('click',function(e){var b=e.currentTarget;if(!armed){armed=setTimeout(function(){armed=0;b.textContent='전부 비우기'},2500);b.textContent='한 번 더 누르면 비워요';return}
  clearTimeout(armed);armed=0;S={};save();app.querySelectorAll('.card').forEach(paint);counts();if(cur==='sum')summary();b.textContent='전부 비우기'});
function warn(){var a=document.querySelector('.top');if(a&&!document.querySelector('.notice')){var p=document.createElement('p');p.className='notice';p.textContent='이 브라우저에서는 고른 것이 저장되지 않아요. 창을 닫기 전에 꼭 「골라 둔 것 복사」를 눌러 주세요.';a.appendChild(p)}}
window.__board={text:text,count:function(){return cards.length}};
counts();
})();
</script></body></html>
