.card{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;transition:opacity .2s,border-color .2s}

.card.is-nope{opacity:.45;border-style:dashed}.card.is-nope img{filter:grayscale(1)}

.card.broken .shot::after{content:"그림이 안 떠요 — 눌러서 원본을 열어 보세요";display:block;padding:16px;color:var(--mute);font-size:13px}
.code{position:absolute;top:8px;left:8px;background:var(--ink);color:var(--bg);font-weight:700;font-size:12px;padding:2px 9px;border-radius:999px}

.badge.kr{background:var(--ink);color:var(--bg)}

.host a:hover{text-decoration:underline}
.line{margin:0 0 6px;font-size:13px}
.warn{margin:0 0 6px;font-size:12px;color:var(--accent)}
.q{margin:0 0 6px;font-size:12px;color:var(--mute);overflow-wrap:anywhere}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}
.chips .chip:last-child:nth-child(odd){grid-column:1/-1}
.chip{border:1px solid var(--line);background:transparent;border-radius:6px;padding:5px 4px;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.nope{width:100%;margin-top:5px;border:1px dashed var(--line);background:transparent;border-radius:6px;padding:5px 4px;font-size:12.5px;color:var(--mute)}
.nope[aria-pressed="true"]{background:var(--nope);border-color:var(--nope);border-style:solid;color:#fff}
.memo{display:none;width:100%;margin-top:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:6px 8px;font:inherit;font-size:12.5px}

.none{color:var(--mute);font-size:14px}

.bar .cnt{margin-right:auto;font-size:14px}
.bar button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:8px 16px;font-weight:600}
